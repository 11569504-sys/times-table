
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九九乘法闖關王</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Microsoft JhengHei", sans-serif;
    background: linear-gradient(135deg, #e4f5ff, #f4edff);
    color: #293653;
    min-height: 100vh;
    padding: 20px;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
  }

  header { text-align: center; padding: 10px 0 20px; }

  .mascot { font-size: 62px; }

  h1 {
    font-size: clamp(28px, 5vw, 42px);
    margin: 5px 0;
    color: #4659bb;
  }

  .subtitle { color: #687492; font-size: 16px; }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 18px;
  }

  .stat {
    background: white;
    border-radius: 18px;
    padding: 15px 8px;
    text-align: center;
    box-shadow: 0 5px 15px #5266a015;
  }

  .stat-label { font-size: 13px; color: #7a849d; }
  .stat-value { font-size: 25px; font-weight: bold; margin-top: 4px; }

  .panel {
    background: white;
    border-radius: 26px;
    padding: clamp(18px, 4vw, 32px);
    box-shadow: 0 10px 30px #5266a01c;
  }

  .settings {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  select, button {
    font: inherit;
    border: 0;
    border-radius: 13px;
    padding: 12px 16px;
  }

  select {
    background: #f0f3ff;
    color: #394a94;
    cursor: pointer;
  }

  button { cursor: pointer; font-weight: bold; transition: .15s; }
  button:hover { transform: translateY(-2px); }
  button:active { transform: scale(.98); }

  .primary { background: #5969d8; color: white; }
  .secondary { background: #edf0ff; color: #4e5cb7; }

  .progress-area { margin: 18px 0 25px; }

  .progress-text {
    display: flex;
    justify-content: space-between;
    color: #75809b;
    font-size: 14px;
    margin-bottom: 8px;
  }

  .progress-track {
    height: 12px;
    background: #edf0fa;
    border-radius: 20px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #77d9bd, #5b9df5);
    border-radius: 20px;
    transition: width .3s;
  }

  .question {
    text-align: center;
    font-size: clamp(38px, 9vw, 64px);
    font-weight: 900;
    color: #34438f;
    padding: 20px 0;
  }

  .question small { font-size: 25px; color: #9aa4c4; }

  .answer-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    max-width: 460px;
    margin: 0 auto;
  }

  .answer {
    background: #f0f3ff;
    color: #394a94;
    border: 3px solid transparent;
    font-size: 25px;
    min-height: 68px;
  }

  .answer:hover { background: #e5eaff; }
  .answer.correct { background: #d9f8e9; border-color: #48c99b; color: #187a58; }
  .answer.wrong { background: #ffe4e6; border-color: #f18b9a; color: #a83d50; }
  .answer:disabled { cursor: default; }

  .feedback {
    min-height: 35px;
    text-align: center;
    margin: 18px 0 5px;
    font-size: 18px;
    font-weight: bold;
  }

  .feedback.good { color: #15976b; }
  .feedback.bad { color: #d05265; }

  .bottom-actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-top: 15px;
  }

  .hidden { display: none !important; }

  .result { text-align: center; padding: 20px 0; }
  .result-emoji { font-size: 75px; }
  .result h2 { font-size: 30px; color: #4659bb; }
  .result-score { font-size: 24px; font-weight: bold; margin: 18px; }
  .result p { color: #687492; line-height: 1.8; }

  .tip {
    background: #fff8df;
    border-radius: 15px;
    padding: 14px;
    color: #7e682b;
    font-size: 14px;
    margin-top: 20px;
    line-height: 1.7;
  }

  footer { text-align: center; color: #8891a8; font-size: 13px; padding: 22px 0 5px; }

  @media (max-width: 420px) {
    body { padding: 12px; }
    .stats { gap: 7px; }
    .stat-value { font-size: 21px; }
    .answer { min-height: 60px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="mascot">🦊</div>
    <h1>九九乘法闖關王</h1>
    <div class="subtitle">動動腦、快快答，成為乘法小高手！</div>
  </header>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">⭐ 得分</div>
      <div class="stat-value" id="score">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">📝 答對題數</div>
      <div class="stat-value" id="correctCount">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">⏱️ 剩餘時間</div>
      <div class="stat-value" id="time">不限時</div>
    </div>
  </div>

  <main class="panel">
    <div id="gameScreen">
      <div class="settings">
        <label for="mode">遊戲模式</label>
        <select id="mode">
          <option value="practice">輕鬆練習（不限時）</option>
          <option value="timed">限時挑戰（60 秒）</option>
        </select>
        <label for="range">出題範圍</label>
        <select id="range">
          <option value="9">完整九九乘法</option>
          <option value="5">1～5 乘法練習</option>
          <option value="7">1～7 乘法練習</option>
        </select>
      </div>

      <div class="progress-area">
        <div class="progress-text">
          <span id="questionNumber">第 1 題／共 10 題</span>
          <span id="accuracy">答對率：0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>

      <div class="question" id="question">3 × 4 <small>= ?</small></div>
      <div class="answer-grid" id="answerGrid"></div>
      <div class="feedback" id="feedback" aria-live="polite">選出正確答案吧！</div>

      <div class="bottom-actions">
        <button class="primary" id="nextBtn" disabled>下一題 →</button>
        <button class="secondary" id="restartBtn">重新開始 ↻</button>
      </div>

      <div class="tip">
        💡 小提醒：先想一想兩個數字相乘的結果，再選擇答案。每答對一題可得 10 分！
      </div>
    </div>

    <div id="resultScreen" class="result hidden">
      <div class="result-emoji" id="resultEmoji">🏆</div>
      <h2 id="resultTitle">闖關完成！</h2>
      <div class="result-score" id="resultScore">獲得 100 分！</div>
      <p id="resultText"></p>
      <button class="primary" id="playAgainBtn">再玩一次！</button>
    </div>
  </main>

  <footer>🌈 每天練習一點點，數學能力進步多一點！</footer>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  let a = 1, b = 1;
  let score = 0, correct = 0, answered = 0, questionNo = 0;
  let seconds = 60, timer = null;
  let locked = false, gameOver = false;
  let maxNumber = 9;
  let questionLimit = 10;

  function shuffle(list) {
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
    return list;
  }

  function makeOptions(answer) {
    const options = new Set([answer]);
    while (options.size < 4) {
      const offset = Math.floor(Math.random() * 17) - 8;
      const candidate = answer + offset;
      if (candidate > 0 && candidate <= maxNumber * maxNumber) {
        options.add(candidate);
      }
    }
    return shuffle([...options]);
  }

  function updateStats() {
    $("score").textContent = score;
    $("correctCount").textContent = correct;
    $("accuracy").textContent =
      "答對率：" + (answered ? Math.round(correct / answered * 100) : 0) + "%";
    $("questionNumber").textContent =
      `第 ${Math.min(questionNo + 1, questionLimit)} 題／共 ${questionLimit} 題`;
    $("progressBar").style.width = (questionNo / questionLimit * 100) + "%";
  }

  function newQuestion() {
    if (gameOver) return;
    locked = false;
    $("nextBtn").disabled = true;
    $("feedback").textContent = "選出正確答案吧！";
    $("feedback").className = "feedback";
    $("answerGrid").innerHTML = "";

    a = Math.floor(Math.random() * maxNumber) + 1;
    b = Math.floor(Math.random() * maxNumber) + 1;
    const answer = a * b;

    $("question").innerHTML = `${a} × ${b} <small>= ?</small>`;

    makeOptions(answer).forEach(value => {
      const btn = document.createElement("button");
      btn.className = "answer";
      btn.textContent = value;
      btn.addEventListener("click", () => checkAnswer(value, answer, btn));
      $("answerGrid").appendChild(btn);
    });

    updateStats();
  }

  function checkAnswer(value, answer, selectedButton) {
    if (locked || gameOver) return;
    locked = true;
    answered++;

    const buttons = [...$("answerGrid").querySelectorAll("button")];
    buttons.forEach(btn => {
      btn.disabled = true;
      if (Number(btn.textContent) === answer) btn.classList.add("correct");
    });

    if (value === answer) {
      correct++;
      score += 10;
      $("feedback").textContent = "🎉 太棒了！答對了！ +10 分";
      $("feedback").className = "feedback good";
    } else {
      selectedButton.classList.add("wrong");
      $("feedback").textContent = `再接再厲！正確答案是 ${answer}。`;
      $("feedback").className = "feedback bad";
    }

    questionNo++;
    $("progressBar").style.width = (questionNo / questionLimit * 100) + "%";
    $("questionNumber").textContent =
      `已完成 ${questionNo} 題／共 ${questionLimit} 題`;
    updateStats();

    if (questionNo >= questionLimit) {
      $("nextBtn").textContent = "查看成績 →";
    } else {
      $("nextBtn").textContent = "下一題 →";
    }
    $("nextBtn").disabled = false;
  }

  function nextQuestion() {
    if (!locked || gameOver) return;
    if (questionNo >= questionLimit) {
      finishGame();
    } else {
      newQuestion();
    }
  }

  function finishGame() {
    gameOver = true;
    clearInterval(timer);
    $("gameScreen").classList.add("hidden");
    $("resultScreen").classList.remove("hidden");

    const accuracy = answered ? Math.round(correct / answered * 100) : 0;
    let emoji = "💪", title = "挑戰完成！";
    if (accuracy === 100) {
      emoji = "🏆"; title = "太厲害了！滿分高手！";
    } else if (accuracy >= 80) {
      emoji = "🌟"; title = "表現優秀！";
    } else if (accuracy >= 60) {
      emoji = "🎉"; title = "做得很好！繼續加油！";
    }

    $("resultEmoji").textContent = emoji;
    $("resultTitle").textContent = title;
    $("resultScore").textContent = `⭐ ${score} 分`;
    $("resultText").innerHTML =
      `你完成了 <b>${answered}</b> 題，答對 <b>${correct}</b> 題。<br>` +
      `答對率：<b>${accuracy}%</b><br>` +
      (accuracy === 100 ? "你已經是乘法小達人了！" : "多練習幾次，一定會越來越熟練！");
  }

  function startTimer() {
    clearInterval(timer);
    if ($("mode").value !== "timed") {
      $("time").textContent = "不限時";
      return;
    }
    seconds = 60;
    $("time").textContent = seconds;
    timer = setInterval(() => {
      seconds--;
      $("time").textContent = seconds;
      if (seconds <= 0) {
        $("time").textContent = "0";
        finishGame();
      }
    }, 1000);
  }

  function restartGame() {
    clearInterval(timer);
    score = 0;
    correct = 0;
    answered = 0;
    questionNo = 0;
    locked = false;
    gameOver = false;
    maxNumber = Number($("range").value);
    $("gameScreen").classList.remove("hidden");
    $("resultScreen").classList.add("hidden");
    $("nextBtn").textContent = "下一題 →";
    startTimer();
    newQuestion();
  }

  $("nextBtn").addEventListener("click", nextQuestion);
  $("restartBtn").addEventListener("click", restartGame);
  $("playAgainBtn").addEventListener("click", restartGame);
  $("mode").addEventListener("change", restartGame);
  $("range").addEventListener("change", restartGame);

  restartGame();
})();
</script>
</body>
</html>
